version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sinhala_fact_check_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  app:
    build: .
    container_name: sinhala_fact_check_app
    ports:
      - "8501:8501"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - qdrant
    restart: always

volumes:
  qdrant_data:
